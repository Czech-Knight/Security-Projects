services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model:
    image: curlimages/curl:8.12.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL: ${YASHSEC_OLLAMA_MODEL:-qwen2.5-coder:1.5b}
    command:
      - sh
      - -c
      - >-
        curl --fail --show-error --silent http://ollama:11434/api/pull
        -H 'Content-Type: application/json'
        -d "{\"name\":\"$${OLLAMA_MODEL}\",\"stream\":false}"
    restart: "no"

  yashsec:
    build: .
    restart: unless-stopped
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      YASHSEC_ENV: production
      YASHSEC_DOCS_ENABLED: "false"
      YASHSEC_CONTAINER_MODE: "true"
      YASHSEC_HOST: 0.0.0.0
      YASHSEC_PORT: 8787
      YASHSEC_DATA_DIR: /app/data
      YASHSEC_ALLOW_REMOTE_DYNAMIC_SCAN: "false"
      YASHSEC_ALLOW_CLOUD_AI: "false"
      YASHSEC_OLLAMA_URL: http://ollama:11434
      YASHSEC_OLLAMA_MODEL: ${YASHSEC_OLLAMA_MODEL:-qwen2.5-coder:1.5b}
    volumes:
      - yashsec_data:/app/data
      - ${YASHSEC_TARGET_ROOT:-./sample_targets}:/targets:ro

volumes:
  yashsec_data:
  ollama_data:
