name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/ConstructTrack.Web/ConstructTrack.Web.csproj

      - name: Build
        run: dotnet build src/ConstructTrack.Web/ConstructTrack.Web.csproj --configuration Release --no-restore
