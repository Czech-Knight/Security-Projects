[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "yashsec-autopilot"
version = "1.0.0rc1"
description = "Local repository and API security automation with human review and private AI assistance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yash"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<46",
]

[tool.setuptools]
packages = ["app", "app.core", "app.scanners"]

[tool.setuptools.package-data]
app = ["static/*", "static/assets/*"]
