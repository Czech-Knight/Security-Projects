name: Secret exposure review

on:
  pull_request:
  push:
    branches: [yash]
  schedule:
    - cron: '47 3 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan tracked files for secret candidates (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install scanner
        run: python -m pip install 'detect-secrets==1.5.0'
      - name: Scan working tree without printing candidate values
        shell: bash
        run: |
          mkdir -p security-reports
          detect-secrets scan --all-files --exclude-files '(package-lock\\.json|uv\\.lock|\\.terraform\\.lock\\.hcl)$' > security-reports/secret-candidates.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('security-reports/secret-candidates.json').read_text())
          count = sum(len(entries) for entries in report.get('results', {}).values())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"Potential secret candidates (advisory): {count}. Review report privately and remove confirmed secrets; rotate exposed credentials.\n")
              summary.write("This scans the checked-out working tree, not the full Git history; findings are not a merge gate.\n")
          PY
      - name: Archive candidate metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-candidates-${{ github.run_id }}
          path: security-reports/secret-candidates.json
          retention-days: 7
          if-no-files-found: warn
